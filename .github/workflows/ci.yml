name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No browser download on purpose: patchright is imported lazily inside the
      # browser-launch path, so the test suite runs without a browser installed.
      - run: pip install -e .[dev]
      - run: pytest
